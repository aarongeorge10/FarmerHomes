<!DOCTYPE html>
<html>

<head>
    <title>Seed Markets</title>

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: #f5f7f6;
            padding: 40px;
        }

        h2 {
            color: #2E7D32;
            margin-bottom: 30px;
        }

        .market-card {
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        .distance {
            font-size: 14px;
            color: #555;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background: #2E7D32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <h2>🌱 Seed Markets Near You</h2>

    {% for item in markets %}
    <div class="market-card">
        <h3>{{ item.market.name }}</h3>
        <p>{{ item.market.village }}, {{ item.market.district }}</p>
        <p class="distance">📍 {{ item.distance }} km away</p>

        <a href="{% url 'market_products' item.market.id %}?category=seed">
            View Seed Products →
        </a>
    </div>
    {% empty %}
    <p>No seed markets found nearby.</p>
    {% endfor %}

</body>

</html>
