<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Smart Agriculture</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1B5E20, #66BB6A);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: fadeSlide 0.8s ease;
            position: relative;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .title {
            text-align: center;
            color: #fff;
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: none;
            outline: none;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.95);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #F9A825, #FFD54F);
            color: #1B1B1B;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
        }

        .error {
            background: rgba(255, 0, 0, 0.12);
            color: #ff4d4d;
        }

        .success {
            background: rgba(0, 255, 0, 0.12);
            color: #d4ffd8;
        }

        .back-link {
            display: block;
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .card {
                margin: 20px;
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h2 class="title">Forgot Password 🔐</h2>
        <p class="subtitle">
            Enter your registered email and we’ll send you a reset link
        </p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <input type="email" name="email" placeholder="Registered email" required>
            </div>

            <button type="submit" class="submit-btn">
                Send Reset Link
            </button>
        </form>

        {% if error %}
        <div class="message error">{{ error }}</div>
        {% endif %}

        {% if success %}
        <div class="message success">{{ success }}</div>
        {% endif %}

        <a href="{% url 'login' %}" class="back-link">
            ← Back to Login
        </a>
    </div>

</body>

</html>
