{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Smart Agriculture</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #1B5E20, #66BB6A);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 42px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
            animation: fadeSlide 0.9s ease;
            position: relative;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .back-arrow {
            position: absolute;
            top: 22px;
            left: 22px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }

        .back-arrow:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateX(-3px);
        }


        .login-title {
            text-align: center;
            color: #fff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .login-subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 14px;
            border: none;
            outline: none;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.95);
            transition: box-shadow 0.2s ease, transform 0.2s ease;
        }

        .form-group input:focus {
            box-shadow: 0 0 0 3px rgba(102, 187, 106, 0.4);
            transform: scale(1.01);
        }

        .form-group input::placeholder {
            color: #777;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.12);
            color: #ff4d4d;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #F9A825, #FFD54F);
            color: #1B1B1B;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
        }

        .register-link {
            display: block;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
        }

        .register-link:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            font-size: 12.5px;
            color: rgba(255, 255, 255, 0.85);
        }

        @media (max-width: 480px) {
            .login-wrapper {
                margin: 20px;
                padding: 32px 24px;
            }
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <a href="{% url 'home' %}" class="back-arrow" title="Back to Home">
            &#8592;
        </a>
        <h2 class="login-title">Welcome Back 🌱</h2>
        <p class="login-subtitle">Login to your Smart Agriculture account</p>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <input type="text" name="username" placeholder="Username" required>
            </div>

            <div class="form-group">
                <input type="password" name="password" placeholder="Password" required>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <a href="{% url 'register' %}" class="register-link">
            New here? Create an account
        </a>

        <div class="footer-text">
            Secure • Simple • Farmer-first 🌾
        </div>
    </div>

</body>

</html>
