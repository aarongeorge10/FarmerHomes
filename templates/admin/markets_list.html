{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markets Management</title>

    <style>
        :root {
            --green: #2E7D32;
            --green-light: #E8F5E9;
            --dark: #1B1B1B;
            --bg: #F5F7F6;
            --radius: 14px;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        * {
            box-sizing: border-box;
            font-family: "Segoe UI", system-ui, sans-serif;
        }

        body {
            background: var(--bg);
            padding: 40px;
        }

        /* NAVBAR */
        .navbar {
            background: linear-gradient(90deg, #1b5e20, #2e7d32);
            color: white;
            padding: 14px 30px;
            border-radius: 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            box-shadow: var(--shadow);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            font-size: 18px;
            font-weight: 700;
        }

        .divider {
            width: 1px;
            height: 22px;
            background: rgba(255, 255, 255, 0.4);
        }

        .page-title {
            font-size: 15px;
            opacity: 0.9;
        }

        .nav-right {
            display: flex;
            gap: 20px;
        }

        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            opacity: 0.9;
            padding: 6px 14px;
            border-radius: 10px;
            display: inline-block;
            /* 🔥 VERY IMPORTANT */
            transition: all 0.25s ease;
        }

        .nav-link:hover {
            opacity: 1;
            background: rgba(255, 255, 255, 0.15);
        }

        .nav-link.active {
            background: #C8E6C9;
            color: #1B5E20;
            font-weight: 700;
            text-decoration: none;
            /* remove underline */
        }

        .nav-link.logout {
            color: #ffebee;
        }


        /* HEADER */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .page-header h2 {
            color: var(--green);
            margin: 0;
            font-size: 26px;
        }

        .add-btn {
            background: var(--green);
            color: white;
            padding: 10px 18px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            box-shadow: var(--shadow);
            transition: 0.3s ease;
        }

        .add-btn:hover {
            background: #1b5e20;
            transform: translateY(-2px);
        }

        /* TABLE CARD */
        .table-card {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 14px;
            background: var(--green-light);
            color: var(--green);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #eee;
            color: #444;
            font-size: 15px;
        }

        tr:hover td {
            background: #f9fdf9;
        }

        /* EMPTY STATE */
        .empty {
            text-align: center;
            padding: 30px;
            color: #888;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            th,
            td {
                padding: 10px;
            }
        }
    </style>
</head>

<body>
    <!-- NAVBAR -->
    <div class="navbar">
        <div class="nav-left">
            <span class="logo">🌾 FarmerHomes Admin</span>
            <span class="divider"></span>
            <span class="page-title">Add Market</span>
        </div>

        <div class="nav-right">
            <a href="{% url 'admin_dashboard' %}" class="nav-link">Dashboard</a>
            <a href="{% url 'admin_markets' %}" class="nav-link active">Markets</a>
            <a href="{% url 'admin_products' %}" class="nav-link">Products</a>
            <a href="{% url 'admin_users' %}" class="nav-link">Manage Users</a>
            <a href="{% url 'logout' %}" class="nav-link logout">Logout</a>
        </div>

    </div>

    <div class="page-header">
        <h2>📍 All Markets</h2>
        <a href="{% url 'add_market' %}" class="add-btn">➕ Add Market</a>
    </div>

    <div class="table-card">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>District</th>
                    <th>State</th>
                </tr>
            </thead>
            <tbody>
                {% for market in markets %}
                <tr>
                    <td>{{ market.name }}</td>
                    <td>{{ market.district }}</td>
                    <td>{{ market.state }}</td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3" class="empty">
                        No markets added yet 🌱
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>

</html>
